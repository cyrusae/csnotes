# cargo mutants configuration
# https://mutants.rs/configuration.html
#
# Note: cargo-mutants 27.0.0 does not support setting test environment variables
# via config.  CSNOTES_NO_NOTIFY=1 suppresses desktop notifications spawned by
# the `notify()` helper in reconcile.rs.  Set it in the shell before running
# cargo mutants if needed:
#   CSNOTES_NO_NOTIFY=1 cargo mutants

# replace_note_links advances `remaining` by idx+1 to skip past the non-matching `[`.
# Mutating `+` to `*` produces idx*1 = idx — same position, infinite loop.
# Mutating `+` to `-` produces idx-1, which also loops on any string where
# the else branch fires more than once. The else branch IS tested; these
# mutations simply cannot fail fast by design.  Function-name pattern to
# avoid staleness when surrounding code shifts line numbers.
exclude_re = [
    "replace \\+ with .* in replace_note_links",

    # AuditResult::print writes to stdout/stderr; output not verifiable in unit tests.
    "AuditResult.*print",

    # collect_text SoftBreak/LineBreak arm: unreachable for ATX headings (single-line by
    # CommonMark spec); comrak never emits these nodes inside a Heading's inline children.
    "SoftBreak.*LineBreak.*in collect_text",

    # ── Structurally untestable ───────────────────────────────────────────────

    # Backends: spawning claude/agy requires real binaries; not unit-testable.
    "run_interactive",
    "BackendLauncher for .*>::launch",
    ">::backend_name",

    # Trivial Display/Debug impls whose formatted output no test asserts on.
    "Display for AiBackend>::fmt",
    "Debug for FilenameFormat>::fmt",
    "FilenameFormat::as_str",

    # ManifestLock::drop: flock(LOCK_UN) is a kernel side-effect; no unit
    # test can observe whether the advisory lock was released.
    "Drop for ManifestLock>::drop",

    # Terminal color setup: mutates colorterm state; not observable in tests.
    "init_color",

    # reindex: `fm.last_updated >= topic.last_updated` assigns the same value as
    # `>` would have kept — semantically equivalent, no observable difference.
    "replace > with >= in reindex",

    # run_teardown stdout display: `relinked > 0` and `n_flags > 0` only control
    # whether a summary line is printed to stdout — not observable in any test.
    "replace > with .* in run_teardown",

    # run_teardown structural dispatch: RenameAtomic/MoveAtomic/PromoteAtomic/
    # DemoteTopic/MergeTopics/SplitTopic dispatch to well-tested execute_* functions
    # in ops/structural.rs.  End-to-end coverage requires a full vault + workspace;
    # rename_topic, set_embed, and update_note are already covered by lifecycle tests.
    "delete match arm Op::RenameAtomic",
    "delete match arm Op::MoveAtomic",
    "delete match arm Op::PromoteAtomic",
    "delete match arm Op::DemoteTopic",
    "delete match arm Op::MergeTopics.*in run_teardown",
    "delete match arm Op::SplitTopic",

    # hsl_to_rgb boundary mutations: `< → <=` at the exact hue boundaries (60, 120,
    # 180, 240, 300°) is semantically equivalent — the HSL formula is continuous,
    # so the adjacent branches compute identical RGB values at each crossing point.
    "replace < with <= in hsl_to_rgb",

    # rainbow: the function short-circuits to a plain string when color_supported()
    # is false.  In all unit tests stdout is not a tty, so the ANSI gradient code
    # never executes and no operator mutation inside it can be observed.
    "in rainbow",

    # Interactive TTY prompts: all read from stdin; untestable without a pty.
    "prompt_courses",
    "prompt_bool",
    "prompt -> Result",
    "prompt_no_recording",
    "prompt_choice",
    "prompt_discard_only",
]
